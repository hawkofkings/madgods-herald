services:
  - type: web
    name: madgods-herald-api
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: madgods-herald-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_PATH
        value: /var/data/herald.sqlite
      - key: TRUST_PROXY
        value: "true"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: MANIA_ROLE_ID
        sync: false
      - key: DEMENTIA_ROLE_ID
        sync: false
      - key: SESSION_SECRET
        generateValue: true
